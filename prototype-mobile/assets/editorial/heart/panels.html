                </div>
                <div class="heart-health__popup--info">
                    <div class="heart-health__popup--num">1</div>
                    <div class="heart-health__popup--scroll">
                        <div class="heart-health__popup--title">
                            <h2 class="_good">Аорта</h2>
                            <h2 class="_bad">Атеросклеротическое поражение аорты</h2>
                        </div>
                        <div class="heart-health__popup--text _good">
                            Аорта&nbsp;&mdash; самый крупный артериальный сосуд. Именно с&nbsp;нее начинается большой круг
                            кровообращения, который поставляет богатую кислородом кровь во&nbsp;все структуры организма.
                            Аорта имеет ключевую роль в&nbsp;поддержании нормальной работы сердечно-сосудистой системы.
                            Любые ее&nbsp;изменения вызывают тяжелые нарушения, вплоть до&nbsp;сердечно-сосудистой
                            недостаточности.
                        </div>
                        <div class="heart-health__popup--text _bad">
                            Аорта, как и&nbsp;любой сосуд, при поражении атеросклерозом становится жесткой. В&nbsp;результате
                            кровь возвращается к&nbsp;самому сердцу быстрее&nbsp;&mdash; не&nbsp;в&nbsp;диастолу (когда
                            происходит наполнение самих коронарных сосудов, которые питают сердце), а&nbsp;в&nbsp;систолу.
                            <br>
                            Стенки митрального клапана не&nbsp;успевают закрыться. Кровь возвращается в&nbsp;левый
                            желудочек, который при последующем сокращении должен приложить еще больше усилий, чтобы
                            вытолкнуть из&nbsp;себя бОльший объем крови.
                        </div>
                    </div>
                </div>
            </div>
        </div></template>
<template data-heart-panel="2"><div id="heart-popup-2" class="heart-health__popup--container">
            
            <div class="heart-health__popup--row">
                <div class="heart-health__popup--img">
                    <iframe title="Иллюстрация работы сердца" class="_bad" data-src="./assets/editorial/heart/2/index.html" scrolling="no" frameborder="0"></iframe>
                    <iframe title="Иллюстрация работы сердца" class="_good" data-src="./assets/editorial/heart/2/static.html" scrolling="no"
                            frameborder="0"></iframe>
                </div>
                <div class="heart-health__popup--info">
                    <div class="heart-health__popup--num">2</div>
                    <div class="heart-health__popup--scroll">
                        <div class="heart-health__popup--text _good">
                            <div class="heart-health__popup--title">
                                <h2>Клетки сердечной мышцы (кардиомиоциты)</h2>
                            </div>
                            Кардиомиоциты&nbsp;&mdash; мышечные клетки сердца, благодаря которым сердце выполняет свою
                            основную функцию&nbsp;&mdash; насоса.
                        </div>
                        <div class="heart-health__popup--text _bad">
                            <div class="heart-health__popup--title">
                                <h2>Гипертрофия кардиомиоцитов</h2>
                            </div>
                            Клетки миокарда становятся &laquo;больше&raquo; (&laquo;толще&raquo;). Это приводит к&nbsp;тому,
                            что они &laquo;поджимают&raquo; сосуды и&nbsp;нервы, которые проходят в&nbsp;межклеточном
                            пространстве.
                            <br>
                            Гипертрофия клеток миокарда может привести к повышению риска ишемической болезни сердца (ИБС), инфаркту миокарда
                            (ИМ), внезапной остановки сердца и&nbsp;аритмии, а&nbsp;также хронической сердечной
                            недостаточности (ХСН).
                        </div>
                    </div>
                </div>
            </div>
        </div></template>

                            <h2 class="_good">Коронарные сосуды сердца</h2>
                            <h2 class="_bad">Атеросклероз коронарных сосудов</h2>
                        </div>
                        <div class="heart-health__popup--text _good">
                            Это сосуды, которые &laquo;питают&raquo; само сердце. Они доставляют к&nbsp;миокарду насыщенную
                            кислородом (артериальную) кровь, и&nbsp;отводят от&nbsp;сердечной мышцы венозную кровь.
                        </div>
                        <div class="heart-health__popup--text _bad">
                            При воздействии вышеописанных факторов риска повреждаются стенки сосудов.
                            В&nbsp;местах этих повреждений откладывается холестерин, и&nbsp;со&nbsp;временем формируется
                            атеросклеротическая бляшка. Стенка сосуда становится жесткой. При разрыве
                            бляшки в&nbsp;этом месте могут скапливаться тромбоциты, и&nbsp;образоваться тромб,
                            который приводит к&nbsp;частичному или полному нарушению кровотока в&nbsp;коронарном
                            сосуде и&nbsp;является причиной серьезного осложнения – инфаркта миокарда
                        </div>
                    </div>
                </div>

<template data-heart-panel="4"><div id="heart-popup-4" class="heart-health__popup--container">
            
            <div class="heart-health__popup--row">
                <div class="heart-health__popup--img">
                    <iframe title="Иллюстрация работы сердца" class="_bad" data-src="./assets/editorial/heart/1/index.html" scrolling="no" frameborder="0"></iframe>
                    <iframe title="Иллюстрация работы сердца" class="_good" data-src="./assets/editorial/heart/1/static.html" scrolling="no"
                            frameborder="0"></iframe>
                </div>
                <div class="heart-health__popup--info">
                    <div class="heart-health__popup--num">4</div>
                    <div class="heart-health__popup--scroll">
                        <div class="heart-health__popup--title">
                            <h2 class="_good">Левый желудочек</h2>
                            <h2 class="_bad">Гипертрофия левого желудочка</h2>
                        </div>
                        <div class="heart-health__popup--text _good">
                            Сердце человека&nbsp;&mdash; главный насос организма, который анатомически представлен четырьмя
                            камерами. Левый желудочек (ЛЖ) играет важнейшую роль в&nbsp;работе сердечно&nbsp;&mdash;
                            сосудистой системы, поскольку с&nbsp;него начинается большой круг кровообращения. Он&nbsp;отвечает
                            за&nbsp;снабжение всего организма кровью, насыщенной кислородом.
                            Для поддержания адекватного снабжения органов кислородом&nbsp;ЛЖ отличается развитым мышечным
                            слоем и&nbsp;более сложным строением, в&nbsp;сравнении с&nbsp;правым &laquo;соседом&raquo;.
                        </div>
                        <div class="heart-health__popup--text _bad">
                            Проблема этой патологии в&nbsp;том, что клетки миокарда становятся &laquo;больше&raquo; (&laquo;толще&raquo;),
                            увеличивается их&nbsp;количество. Это приводит к&nbsp;ремоделированию сердца. Это патология
                            часто отмечается на&nbsp;фоне длительного повышения артериального давления.
                            <br>
                            Гипертрофия левого желудочка, в&nbsp;свою очередь, повышает риск развития ишемической болезни сердца (ИБС),
                            инфаркта миокарда (ИМ), внезапной остановки сердца и&nbsp;аритмии, а&nbsp;также хронической сердечной недостаточности (ХСН).
                            <br>
                            Как показывают исследования, гипертрофия левого желудочка повышает риск сердечно-сосудистых
                            осложнений и&nbsp;смертности<sup>1,2</sup>.
                            <br>
                            Обнаружить подобные изменения со&nbsp;стороны&nbsp;ЛЖ врачу помогают такие объективные методы
                            диагностики, как ЭКГ или Эхо&nbsp;&mdash; КГ&nbsp;(УЗИ сердца).

                            <p><small>
                                <sup>1</sup>Levy D, Garrison RJ, Savage DD, Kannel WB, Castelli WP. Prognostic implications of echocardiographically
                                determined left ventricular mass in the Framingham Heart Study. N Engl J Med. 1990;322:1561–1566.<br/>
                                <sup>2</sup>Vakili BA, Okin PM, Devereux RB. Prognostic implications of left ventricular hypertrophy.
                                Am Heart J. 2001;141:334–341.</small></p>
                        </div>
                    </div>
                </div>
            </div>
        </div></template>
